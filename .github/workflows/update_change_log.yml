name: Update Changelog

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update changelog
        uses: laravel/changelog-updater-action@v1

      - name: Commit changes
        run: |
          git config --global user.name "Laravel Bot"
          git config --global user.email "bot@laravel.com"
          git add CHANGELOG.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Update changelog"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
